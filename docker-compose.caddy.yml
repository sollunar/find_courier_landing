name: find-courier-camouflage

services:
  caddy-site:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: find-courier-caddy:local
    container_name: findcourier-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      CAMOUFLAGE_DOMAIN: ${CAMOUFLAGE_DOMAIN:?CAMOUFLAGE_DOMAIN is required}
      CAMOUFLAGE_PORT: ${CAMOUFLAGE_PORT:-9443}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${CAMOUFLAGE_CERT_DIR:?CAMOUFLAGE_CERT_DIR is required}:/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 10s

volumes:
  caddy_data:
  caddy_config:

